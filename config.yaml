# =====================================================
# 24 小时无人直播推流系统 配置文件
# =====================================================

# 全局开关：true 时对满足条件的文件免转码推流（-c copy），大幅降低 CPU 占用。
# 条件：视频编码为 H.264（音频非 AAC 时仅转码音频，视频仍 copy）。
# 不满足条件的文件会自动回退为完整转码。
no_transcode: true

logging:
  level: INFO                # DEBUG / INFO / WARNING / ERROR
  file: ./livestream.log     # 留空则只输出到控制台
  max_bytes: 52428800        # 单个日志文件大小上限（默认 50MB）
  backup_count: 5            # 日志轮转保留个数

# 断流重试策略
retry:
  initial_delay: 3           # 首次重试等待秒数
  max_delay: 60              # 退避上限秒数
  backoff_factor: 2          # 每次失败等待时间倍增
  stable_seconds: 10         # 运行不足该秒数即退出 -> 视为坏文件而非断流
  max_file_retries: 2        # 同一坏文件重试次数，超过则跳过

# 播放列表：files 与 directories 可同时使用，合并后无限循环
playlist:
  files:
    # - /data/videos/intro.mp4
  directories:
    - /data/videos
  extensions: [mp4, mkv, flv, ts, mov, webm, m4v, mpg, mpeg]
  sort: name                 # name 按文件名 / mtime 按修改时间
  shuffle: false             # 每轮循环开始时随机打乱

# 推流目标：可同时向多个目标推流，每个目标一个独立线程
targets:
  # ---- RTMP ----
  - name: rtmp-main
    enabled: true
    protocol: rtmp
    url: rtmp://your-server:1935/live/streamkey
    video_bitrate: 2500k     # 仅转码时生效
    audio_bitrate: 128k
    resolution:              # 留空保持原分辨率，如 1280x720
    gop: 50
    extra_args: []           # 追加给 ffmpeg 的自定义参数

  # ---- SRT ----
  - name: srt-backup
    enabled: false
    protocol: srt
    url: "srt://your-server:9000?mode=caller&streamid=live&pkt_size=1316"
    video_bitrate: 2500k
    audio_bitrate: 128k

  # ---- WebRTC（经 MediaMTX 中转）----
  # ffmpeg 无法直接输出 WebRTC，需部署 MediaMTX：
  #   1. 下载 MediaMTX: https://github.com/bluenviron/mediamtx/releases
  #   2. 运行 ./mediamtx（默认 RTSP 端口 8554，WebRTC 端口 8889）
  #   3. 本目标将流以 RTSP 推给 MediaMTX 的 live 路径
  #   4. 浏览器访问 http://<服务器IP>:8889/live 即可 WebRTC 播放
  - name: webrtc
    enabled: false
    protocol: webrtc
    url: rtsp://127.0.0.1:8554/live
    video_bitrate: 2500k
    audio_bitrate: 128k
